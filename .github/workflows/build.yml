name: Build MacNativeGames IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Switch Game and Keys
        run: |
          echo "Starting secure direct download..."
          
          # 1. 키 파일 다운로드
          curl -L "https://google.com" -o "prod.keys"
          
          # 2. 업데이트 파일 다운로드
          curl -L "https://google.com" -o "Update.nsp"
          
          # 3. 게임 본편 파일 다운로드 (대용량 우회 주소 결합)
          curl -L "https://google.com(curl -sL 'https://google.com' | grep -o 'confirm=[^&]*' | head -n 1 | cut -d= -f2)&id=1X04IOFkkWAmlR3ZgWGTJTrL31iTYNI-v" -o "Game.xci"
          
          echo "Download complete! Checked files list:"
          ls -lh

      - name: Install Required Packages (Homebrew)
        run: |
          echo "Installing missing opus and libvpx packages..."
          brew install opus libvpx

      - name: Run Build Script
        run: |
          # 다운로드된 Game.xci와 Update.nsp라는 직관적인 이름으로 빌드를 수행합니다.
          python3 build_app.py "Game.xci" -k prod.keys --update "Update.nsp" --platform ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: "*.ipa"
