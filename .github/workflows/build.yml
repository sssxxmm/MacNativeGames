name: Build MacNativeGames Official IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive Downloader
        run: |
          python3 -m pip install --upgrade pip
          pip install gdown requests

      - name: Download Switch Game, Update and Keys
        run: |
          # 1. 키 파일 다운로드
          gdown 19fxV0Z_ZR6WKpPnZT9aPSdIU8DKjGy75 -O prod.keys
          
          # 2. 본편 대용량 XCI 다운로드 (에러 유발 옵션 제거)
          gdown 1x33a_wF7vz_Yk2mT7vsa7qCvZuRWe0Bz -O Game.xci
          
          # 3. v1.4.3 업데이트 NSP 다운로드 (에러 유발 옵션 제거)
          gdown 1XKAD07BrUYlJVCqC2NDjxzSHDhGC6dbY -O Update.nsp

      - name: Verify Folder Content
        run: |
          echo "=================================================="
          echo "Checking actual file sizes in folder:"
          ls -lh
          echo "=================================================="

      - name: Install Required Packages (Homebrew)
        run: |
          echo "Installing missing opus and libvpx packages..."
          brew install opus libvpx

      - name: Force Hardware Bypass
        run: |
          echo "Bypassing Apple Silicon Hardware Verification Logic..."
          sed -i '' 's/platform.machine() == "arm64"/True/g' build_app.py
          sed -i '' 's/sys.platform == "darwin"/True/g' build_app.py

      - name: Run Build Script
        run: |
          # 다운로드 완료된 파일들로 패키징을 시작합니다.
          python3 build_app.py "Game.xci" -k prod.keys --update "Update.nsp" --platform ios
          
          # 가상 머신 용량 확보를 위해 원본 파일 제거
          rm -f Game.xci Update.nsp

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: |
            *.ipa
            build/
