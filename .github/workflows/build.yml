name: Build MacNativeGames IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest   # 깃허브가 제공하는 가장 최신 사양의 가상 Mac 컴퓨터를 빌립니다.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive Downloader
        run: |
          python3 -m pip install --upgrade pip
          pip install gdown

      - name: Download Switch Game and Keys
        run: |
          echo "Starting high-speed cloud download..."
          
          # 1. 키 파일 다운로드
          gdown "19fxV0Z_ZR6WKpPnZT9aPSdIU8DKjGy75" -O "prod.keys"
          
          # 2. 업데이트 파일 다운로드
          gdown "1XKAD07BrUYlJVCqC2NDjxzSHDhGC6dbY" -O "The Legend of Zelda Tears of the Kingdom [Update v1.4.3].nsp"
          
          # 3. 게임 본편 파일 다운로드
          gdown "1x33a_wF7vz_Yk2mT7vsa7qCvZuRWe0Bz" -O "The Legend of Zelda Tears of the Kingdom.xci"
          
          echo "Download complete! Verifying files..."
          ls -lh

      - name: Run Build Script
        run: |
          python3 build_app.py "The Legend of Zelda Tears of the Kingdom.xci" -k prod.keys --update "The Legend of Zelda Tears of the Kingdom [Update v1.4.3].nsp" --platform ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: "*.ipa"
