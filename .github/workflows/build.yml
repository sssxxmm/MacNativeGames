name: Build MacNativeGames IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Switch Game and Keys
        run: |
          echo "Starting high-speed cloud download..."
          # 키 파일 다운로드
          curl -L "https://google.com" -o "prod.keys"
          
          # 업데이트 파일 다운로드
          curl -L "https://google.com" -o "The Legend of Zelda Tears of the Kingdom [Update v1.4.3].nsp"
          
          # 게임 본편 파일 다운로드 (대용량 우회 스크립트 적용)
          curl -L "https://google.com(curl -sL 'https://google.com' | grep -o 'confirm=[^&]*' | head -n 1 | cut -d= -f2)&id=1x33a_wF7vz_Yk2mT7vsa7qCvZuRWe0Bz" -o "The Legend of Zelda Tears of the Kingdom.xci"
          
          echo "Download complete! Verifying files..."
          ls -lh

      - name: Run Build Script
        run: |
          python3 build_app.py "The Legend of Zelda Tears of the Kingdom.xci" -k prod.keys --update "The Legend of Zelda Tears of the Kingdom [Update v1.4.3].nsp" --platform ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: "*.ipa"
