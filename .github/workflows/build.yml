name: Build MacNativeGames IPA (Hardware Bypass)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google Drive Downloader
        run: |
          python3 -m pip install --upgrade pip
          pip install gdown

      - name: Download Switch Game and Keys
        run: |
          echo "Starting high-speed cloud download..."
          # 1. 키 파일 다운로드 (구글)
          gdown "19fxV0Z_ZR6WKpPnZT9aPSdIU8DKjGy75" -O "prod.keys"
          
          # 2. 업데이트 파일 다운로드 (구글)
          gdown "1XKAD07BrUYlJVCqC2NDjxzSHDhGC6dbY" -O "Update.nsp"
          
          # 3. 게임 본편 사본 파일 다운로드 (구글 다이렉트 패스)
          gdown "1X04IOFkkWAmlR3ZgWGTJTrL31iTYNI-v" -O "Game.xci"
          
          echo "Download complete! Checked files list:"
          ls -lh

      - name: Install Required Packages (Homebrew)
        run: |
          echo "Installing missing opus and libvpx packages..."
          brew install opus libvpx

      - name: Force Hardware Bypass
        run: |
          echo "Bypassing Apple Silicon Hardware Verification Logic..."
          # 스크립트 내부에서 sysctl 기종 확인 및 플랫폼 제한을 강제로 참(True)으로 변환하여 차단을 무력화합니다.
          sed -i '' 's/needs a Mac with Apple silicon/Bypass Silicon Check Success/g' build_app.py
          sed -i '' 's/platform.machine() == "arm64"/True/g' build_app.py
          sed -i '' 's/sys.platform == "darwin"/True/g' build_app.py

      - name: Run Build Script
        run: |
          python3 build_app.py "Game.xci" -k prod.keys --update "Update.nsp" --platform ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: "*.ipa"
