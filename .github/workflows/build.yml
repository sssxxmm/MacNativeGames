name: Build MacNativeGames Official IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: |
          python3 -m pip install requests gdown

      - name: Download Switch Game and Keys
        shell: python
        run: |
          import requests
          import re
          import os
          import subprocess

          # 1. 키 파일 및 업데이트 다운로드 (gdown 활용)
          print("Downloading keys and update...")
          subprocess.run(['gdown', '19fxV0Z_ZR6WKpPnZT9aPSdIU8DKjGy75', '-O', 'prod.keys'])
          subprocess.run(['gdown', '1XKAD07BrUYlJVCqC2NDjxzSHDhGC6dbY', '-O', 'Update.nsp'])

          # 2. 게임 본편 파일 다운로드 (구글 대용량 차단 우회 파이썬 스크립트)
          file_id = "1X04IOFkkWAmlR3ZgWGTJTrL31iTYNI-v"
          destination = "Game.xci"
          
          print(f"Starting secure direct download for Game.xci (ID: {file_id})...")
          URL = "https://google.com"
          session = requests.Session()
          
          # 1차 요청으로 경고창 확인 토큰 굽기
          response = session.get(URL, params={'id': file_id}, stream=True)
          token = None
          for key, value in response.cookies.items():
              if key.startswith('download_warning'):
                  token = value
                  break
          
          # 토큰이 있다면 주소에 결합하여 17.5GB 진짜 알맹이 데이터 다이렉트 전송 요청
          params = {'id': file_id}
          if token:
              params['confirm'] = token
          
          response = session.get(URL, params=params, stream=True)
          
          # 파일 저장 진행 상황 출력하며 기록
          total_bytes = 0
          with open(destination, "wb") as f:
              for chunk in response.iter_content(chunk_size=1024*1024): # 1MB 단위
                  if chunk:
                      f.write(chunk)
                      total_bytes += len(chunk)
                      if total_bytes % (1024*1024*500) == 0: # 500MB마다 로그 출력
                          print(f"Downloaded: {total_bytes // (1024*1024)} MB...")
                          
          print(f"Download complete! Final size: {os.path.getsize(destination)} bytes")

      - name: Verify Folder Content
        run: |
          echo "=================================================="
          ls -lh
          echo "=================================================="

      - name: Install Required Packages (Homebrew)
        run: |
          echo "Installing missing opus and libvpx packages..."
          brew install opus libvpx

      - name: Force Hardware Bypass
        run: |
          echo "Bypassing Apple Silicon Hardware Verification Logic..."
          sed -i '' 's/platform.machine() == "arm64"/True/g' build_app.py
          sed -i '' 's/sys.platform == "darwin"/True/g' build_app.py

      - name: Run Build Script
        run: |
          python3 build_app.py "Game.xci" -k prod.keys --update "Update.nsp" --platform ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: "*.ipa"
