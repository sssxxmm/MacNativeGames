name: Build MacNativeGames IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download Switch Game and Keys
        run: |
          echo "Starting secure direct download..."
          
          # 1. 키 파일 다운로드
          curl -L "https://google.com" -o "prod.keys"
          
          # 2. 업데이트 파일 다운로드
          curl -L "https://google.com" -o "The Legend of Zelda Tears of the Kingdom [Update v1.4.3].nsp"
          
          # 3. 게임 본편 파일 다운로드 (대용량 확인 팝업 자동 우회 명령어)
          CONFIRM=$(curl -sc /tmp/gcookie "https://google.com" | grep -o 'confirm=[^&]*' | head -n 1 | cut -d= -f2)
          curl -Lb /tmp/gcookie "https://google.com" -o "The Legend of Zelda Tears of the Kingdom.xci"
          
          echo "Download complete! Verifying files..."
          ls -lh

      - name: Install Required Packages (Homebrew)
        run: |
          echo "Installing missing opus and libvpx packages..."
          brew install opus libvpx

      - name: Run Build Script
        run: |
          python3 build_app.py "The Legend of Zelda Tears of the Kingdom.xci" -k prod.keys --update "The Legend of Zelda Tears of the Kingdom [Update v1.4.3].nsp" --platform ios

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ZeldaTotK-IPA
          path: "*.ipa"
